<style>
:root{
  --ground:#F2F4F8; --surface:#FFFFFF; --surface-2:#E9EDF4; --line:#D3DAE6; --line-strong:#B4C0D3;
  --ink:#12233F; --ink-2:#44536E; --ink-3:#6C7A92;
  --accent:#1D4E9E; --accent-ink:#FFFFFF; --accent-soft:#DCE6F5; --gold:#D99A0B; --gold-soft:#FCF0D2;
  --hijau:#1F8A4C; --hijau-soft:#DDF1E4; --kuning:#B7791F; --kuning-soft:#FBEFD5; --merah:#C0392B; --merah-soft:#F8DEDA;
  --abu:#7C879A; --abu-soft:#E6EAF1;
  --shadow:0 1px 2px rgba(18,35,63,.06),0 4px 16px rgba(18,35,63,.05);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0D1320; --surface:#141C2C; --surface-2:#1B2538; --line:#29354D; --line-strong:#3A4867;
    --ink:#E3E9F4; --ink-2:#A8B4CA; --ink-3:#7D8AA3;
    --accent:#6E9BE6; --accent-ink:#0A1426; --accent-soft:#1C2B48; --gold:#F2B941; --gold-soft:#3A2F14;
    --hijau:#4CC27E; --hijau-soft:#16352A; --kuning:#E3A94B; --kuning-soft:#3A2E15; --merah:#EE6B5C; --merah-soft:#3D1D1A;
    --abu:#8F9AB0; --abu-soft:#222C3F;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0D1320; --surface:#141C2C; --surface-2:#1B2538; --line:#29354D; --line-strong:#3A4867;
  --ink:#E3E9F4; --ink-2:#A8B4CA; --ink-3:#7D8AA3;
  --accent:#6E9BE6; --accent-ink:#0A1426; --accent-soft:#1C2B48; --gold:#F2B941; --gold-soft:#3A2F14;
  --hijau:#4CC27E; --hijau-soft:#16352A; --kuning:#E3A94B; --kuning-soft:#3A2E15; --merah:#EE6B5C; --merah-soft:#3D1D1A;
  --abu:#8F9AB0; --abu-soft:#222C3F;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.head{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:14px}
.brand{display:flex;flex-direction:column;gap:4px}
.brand h1{font-size:clamp(24px,4vw,34px);font-weight:800;line-height:1.05}
.brand h1{color:var(--accent)} .brand h1 span{color:var(--gold)}
.brand p{margin:0;color:var(--ink-2)}
.pilot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.pilot .kv{display:flex;flex-direction:column}
.pilot .kv b{font-family:var(--display);font-size:16px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
a.btn{text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--merah);border-color:var(--merah)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.banner{border:1px dashed var(--kuning);background:var(--kuning-soft);border-radius:8px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.banner p{margin:0;max-width:70ch}
.notice{font-size:13px;color:var(--ink-2)}

/* siklus */
.siklus{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step{padding:10px 10px 12px;border-right:1px solid var(--line);position:relative;display:flex;flex-direction:column;gap:2px;min-width:0}
.step:last-child{border-right:0}
.step .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.step .t{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .c{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.step .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.step.eval{background:var(--surface-2)}
.step.eval .c{font-size:13px;font-family:var(--body);font-weight:500;color:var(--ink-2)}
@media (max-width:900px){.siklus{grid-template-columns:repeat(3,minmax(0,1fr))}.step{border-bottom:1px solid var(--line)}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.kpi .lbl{font-size:12px;font-weight:600;color:var(--ink-2);min-height:2.6em}
.kpi .val{display:flex;align-items:baseline;gap:8px}
.kpi .val b{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .val small{color:var(--ink-3);font-size:12px}
.track{position:relative;height:8px;background:var(--surface-2);border-radius:4px;overflow:visible}
.track .fill{height:100%;border-radius:4px;background:var(--accent)}
.track .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.kpi .foot{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)}
.kpi.ok .fill{background:var(--hijau)} .kpi.warn .fill{background:var(--kuning)} .kpi.bad .fill{background:var(--merah)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.hijau{background:var(--hijau-soft);color:var(--hijau)} .pill.kuning{background:var(--kuning-soft);color:var(--kuning)}
.pill.merah{background:var(--merah-soft);color:var(--merah)} .pill.belum{background:var(--abu-soft);color:var(--abu)}

/* panels */
.panels{display:grid;grid-template-columns:1.1fr 1fr 1.1fr;gap:12px}
@media (max-width:1000px){.panels{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel header .tag{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink-2);line-height:1.3;display:block}
.rtlist{display:flex;flex-direction:column;gap:5px;max-height:220px;overflow:auto;padding-right:4px}
.rtrow{display:grid;grid-template-columns:minmax(56px,.9fr) 1fr 84px;width:100%;gap:8px;align-items:center;font-size:12px}
.rtrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statuspick button[aria-pressed="true"].g{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rtrow .bars{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.rtrow .bars i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.statusbig{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sb{border-radius:6px;padding:10px 12px;border-left:4px solid;background:var(--surface-2);text-align:left;border-top:0;border-right:0;border-bottom:0}
.sb b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.sb span{font-size:12px;font-weight:600}
.sb p{margin:2px 0 0;font-size:11px;color:var(--ink-2);line-height:1.35}
.sb.hijau{border-color:var(--hijau)} .sb.hijau span{color:var(--hijau)}
.sb.kuning{border-color:var(--kuning)} .sb.kuning span{color:var(--kuning)}
.sb.merah{border-color:var(--merah)} .sb.merah span{color:var(--merah)}
.sb.belum{border-color:var(--abu)} .sb.belum span{color:var(--abu)}
.sb[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.attn{display:flex;flex-direction:column;gap:10px}
.attn .item{display:flex;flex-direction:column;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.attn .item:last-child{border-bottom:0;padding-bottom:0}
.attn .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.attn .row b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.attn .row b.alert{color:var(--merah)}
.attn ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.attn li button{background:none;border:0;padding:0;text-align:left;color:var(--ink);font-size:12px;display:flex;gap:6px;width:100%}
.attn li button:hover .mono{text-decoration:underline}
.attn li .mono{color:var(--accent);flex:none}
.attn li .why{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--ink-3);font-size:12px}

/* register */
.register{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column}
.reg-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input,.filters select{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 9px;font-size:13px;max-width:100%}
.filters input[type=search]{width:220px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1080px;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td .sub{display:block;color:var(--ink-3);font-size:12px}
.tahap{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent)}
.flags{display:flex;gap:4px;flex-wrap:wrap}
.flag{font-size:10px;font-weight:600;border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;color:var(--ink-2);white-space:nowrap}
.reg-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 14px;font-size:12px;color:var(--ink-2)}
.empty{padding:28px 14px;text-align:center;color:var(--ink-2)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,24,22,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);gap:8px}
.drawer .body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.drawer footer{display:flex;justify-content:space-between;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.fieldset legend{font-size:12px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 9px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin:0}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.checks input{margin-top:3px}
.tahappick{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tahappick button{border:1px solid var(--line-strong);background:var(--surface);border-radius:5px;padding:6px 2px;font-family:var(--display);font-size:10.5px;font-weight:700;letter-spacing:.02em}
.tahappick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.statuspick{display:flex;gap:6px;flex-wrap:wrap}
.statuspick button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.statuspick button[aria-pressed="true"].hijau{background:var(--hijau);border-color:var(--hijau);color:#fff}
.statuspick button[aria-pressed="true"].kuning{background:var(--kuning);border-color:var(--kuning);color:#fff}
.statuspick button[aria-pressed="true"].merah{background:var(--merah);border-color:var(--merah);color:#fff}
.statuspick button[aria-pressed="true"].belum{background:var(--abu);border-color:var(--abu);color:#fff}
.meta{font-size:12px;color:var(--ink-3)}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
.info dt{color:var(--ink-3);font-size:12px}
.info dd{margin:0}
.confirm{background:var(--merah-soft);border-radius:6px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:6px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.help{font-size:12px;color:var(--ink-2);margin:0}
.help code{font-family:var(--mono);background:var(--surface-2);padding:0 4px;border-radius:3px}
.metabox{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.mb{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;min-width:120px}
.mb b{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.mb .dur{height:6px;border-radius:3px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.mb .dur i{display:block;height:100%;background:var(--hijau)}
.mb small{font-size:11px;color:var(--ink-2)}
.headbtns{display:flex;flex-direction:column;gap:6px;justify-content:center}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles .tile:first-child{grid-column:1/-1}}
.tile{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden;min-width:0}
.tile .th{display:flex;gap:10px;align-items:flex-start}
.tile svg{flex:none;width:30px;height:30px}
.tile .tl{font-size:12px;font-weight:700;line-height:1.25}
.tile .tv{font-family:var(--display);font-size:clamp(24px,3vw,32px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.tile .tu{font-size:11px;color:var(--ink-2)}
.tile .tp{margin-top:4px;border-radius:5px;padding:2px 8px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;background:var(--surface-2)}
.tile.biru{background:var(--accent-soft)} .tile.biru svg{color:var(--accent)}
.tile.hijau{background:var(--hijau-soft)} .tile.hijau svg{color:var(--hijau)} .tile.hijau .tp{background:var(--surface);color:var(--hijau)}
.tile.merah{background:var(--merah-soft)} .tile.merah svg{color:var(--merah)} .tile.merah .tp{background:var(--surface);color:var(--merah)}
.tile.kuning{background:var(--gold-soft)} .tile.kuning svg{color:var(--gold)} .tile.kuning .tp{background:var(--surface);color:var(--kuning)}
.tile .tpbar{height:6px;border-radius:3px;background:var(--surface);overflow:hidden;margin-top:4px}
.tile .tpbar i{display:block;height:100%;background:currentColor}
.trio{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px}
@media (max-width:1000px){.trio{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card>h2{background:var(--accent);color:var(--accent-ink);font-size:13px;padding:8px 12px;letter-spacing:.01em}
.card .cb{padding:14px;display:flex;gap:14px;align-items:flex-start;align-content:flex-start;flex-wrap:wrap;flex:1}
.donut{width:150px;height:150px;flex:none}
.donut text{fill:var(--ink);font-family:var(--display)}
.dleg{display:flex;flex-direction:column;gap:8px;font-size:12px;flex:1;min-width:140px}
.dleg div{display:grid;grid-template-columns:12px 1fr;gap:8px;align-items:start}
.dleg i{width:12px;height:12px;border-radius:50%;margin-top:3px}
.dleg small{display:block;color:var(--ink-3)}
.kec{width:100%;display:flex;flex-direction:column;gap:12px}
.kecrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;font-size:12px}
.kecrow .kb{height:22px;background:var(--surface-2);border-radius:3px;position:relative}
.kecrow .kb i{display:block;height:100%;background:var(--accent);border-radius:3px}
.kecrow .kb span{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-weight:700;font-variant-numeric:tabular-nums;font-size:12px}
.bk{display:flex;flex-direction:column;gap:7px;width:100%}
.bkrow{display:grid;grid-template-columns:62px 1fr 92px;gap:8px;align-items:center;font-size:12px;background:none;border:0;padding:0;text-align:left;width:100%}
.bkrow .bb{height:16px;background:var(--surface-2);border-radius:3px;position:relative;overflow:hidden}
.bkrow .bb i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bkrow .bb .all{background:var(--line-strong)} .bkrow .bb .sb{background:var(--accent)}
.bkrow .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.kaxis{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:10px;color:var(--ink-3)}
.kaxis div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.tlst{display:flex;flex-direction:column;gap:8px;width:100%}
.tlst div{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.tlst b{border-radius:6px;color:#fff;font-family:var(--display);font-size:22px;text-align:center;padding:6px 0;font-variant-numeric:tabular-nums}
.tlst span{font-size:13px;font-weight:700}
.tlst small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
.warnline{font-size:12px;color:var(--kuning);margin:0}
@media (prefers-reduced-motion:no-preference){.track .fill,.step .bar{transition:width .4s ease}}

.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--ground)}
.gate .box{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.gate h1{font-size:26px;font-weight:800;color:var(--accent);line-height:1.1}
.gate h1 span{color:var(--gold)}
.gate p{margin:0;color:var(--ink-2)}
.gate .err{color:var(--merah);font-size:13px}
.gate .ok{color:var(--hijau);font-size:13px}
.gate .links{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px}
.gate a,.linkbtn{color:var(--accent);background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline}
.who{font-size:12px;color:var(--ink-2);text-align:right}
.who b{color:var(--ink)}
.excelbox{border:1px dashed var(--line-strong);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* versi Apps Script: register bersumber dari sheet, jadi tambah/impor/hapus dilakukan di spreadsheet */
[data-act="import"],[data-act="add"],#btnDel,#demoBanner,#rekapDemo{display:none!important}
</style>
