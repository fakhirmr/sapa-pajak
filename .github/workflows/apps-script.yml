# Kirim kode apps-script/ ke project Google Apps Script setiap ada push ke main,
# lalu perbarui kedua deployment web app (petugas & publik) ke versi baru. URL tidak berubah.
#
# Perlu diatur sekali di GitHub → Settings → Secrets and variables → Actions:
#   Secret   CLASPRC_JSON       isi file ~/.clasprc.json setelah `npx @google/clasp@2.4.2 login`
#   Variable SCRIPT_ID          Script ID project Apps Script (Project Settings → Script ID)
#   Variable DEPLOY_ID_PETUGAS  Deployment ID web app petugas   (Deploy → Manage deployments)
#   Variable DEPLOY_ID_PUBLIK   Deployment ID web app publik
name: Apps Script

on:
  push:
    branches: [main]
    paths: ["apps-script/**", ".github/workflows/apps-script.yml"]
  workflow_dispatch:

concurrency: apps-script

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang clasp
        run: npm install -g @google/clasp@2.4.2
      - name: Siapkan kredensial dan project
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON" || { echo "::error::Secret CLASPRC_JSON belum diisi"; exit 1; }
          test -n "$SCRIPT_ID" || { echo "::error::Variable SCRIPT_ID belum diisi"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"apps-script"}' "$SCRIPT_ID" > .clasp.json
      - name: Perbarui deployment petugas (Execute as user accessing)
        if: vars.DEPLOY_ID_PETUGAS != ''
        run: |
          node -e 'const f="apps-script/appsscript.json",m=require("./"+f);m.webapp={executeAs:"USER_ACCESSING",access:"ANYONE"};require("fs").writeFileSync(f,JSON.stringify(m,null,2))'
          clasp push --force
          V=$(clasp version "petugas ${GITHUB_SHA::7}" | grep -oE '[0-9]+' | tail -1)
          clasp deploy --deploymentId "${{ vars.DEPLOY_ID_PETUGAS }}" --versionNumber "$V" --description "petugas ${GITHUB_SHA::7}"
      - name: Perbarui deployment publik (Execute as me, Anyone)
        if: vars.DEPLOY_ID_PUBLIK != ''
        run: |
          node -e 'const f="apps-script/appsscript.json",m=require("./"+f);m.webapp={executeAs:"USER_DEPLOYING",access:"ANYONE_ANONYMOUS"};require("fs").writeFileSync(f,JSON.stringify(m,null,2))'
          clasp push --force
          V=$(clasp version "publik ${GITHUB_SHA::7}" | grep -oE '[0-9]+' | tail -1)
          clasp deploy --deploymentId "${{ vars.DEPLOY_ID_PUBLIK }}" --versionNumber "$V" --description "publik ${GITHUB_SHA::7}"
      - name: Kirim kode saja (belum ada Deployment ID)
        if: vars.DEPLOY_ID_PETUGAS == '' && vars.DEPLOY_ID_PUBLIK == ''
        run: clasp push --force
