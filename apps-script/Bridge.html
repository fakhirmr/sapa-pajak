<script>
// Penghubung dashboard ke Google Sheets lewat google.script.run.
// Menyediakan antarmuka window.claude.use("db"|"user"|"downloads") yang dipakai logika dashboard.
(function () {
  "use strict";
  function mapErr(e) {
    var m = (e && e.message) || String(e);
    if (/TIDAK_BERHAK|permission|izin|access/i.test(m)) return { code: "not_allowed", message: m.replace(/^.*TIDAK_BERHAK:\s*/, "") };
    return { code: "unavailable", message: m };
  }
  function run(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (res, rej) {
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(mapErr(e)); });
      r[fn].apply(r, args);
    });
  }
  var st = { recs: new Map(), conf: {}, me: null, listeners: new Set(), confL: {}, nama: "", peran: "", loaded: false };
  var snapDoc = function (id, d) { return { id: id, exists: !!d, data: function () { return d || undefined; }, metadata: { fromCache: false, hasPendingWrites: false } }; };
  function emit() {
    var docs = []; st.recs.forEach(function (d, id) { docs.push(snapDoc(id, d)); });
    var snap = { docs: docs, size: docs.length, empty: !docs.length, docChanges: function () { return []; }, metadata: {} };
    st.listeners.forEach(function (l) { try { l.next(snap); } catch (_) {} });
  }
  function emitC(k) { (st.confL[k] || []).forEach(function (f) { try { f(snapDoc(k, st.conf[k])); } catch (_) {} }); }
  function applyConfig(c) { st.conf.pilot = c.pilot; st.conf.rekap = c.rekap; st.publikUrl = c.publikUrl || ""; emitC("pilot"); emitC("rekap"); applyPublik(); }
  function applyPublik() { var a = document.getElementById("linkPublik"); if (a) { a.hidden = !st.publikUrl; if (st.publikUrl) a.href = st.publikUrl; } }
  function refresh() {
    return run("getData").then(function (d) {
      st.me = d.me; st.nama = d.me.nama; st.peran = d.me.peran;
      var m = new Map(); d.rows.forEach(function (r) { m.set(r.id, r); }); st.recs = m; st.loaded = true;
      emit(); applyConfig(d.config);
      var u = document.getElementById("lastSync"); if (u) u.textContent = "Disinkronkan " + new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
      return d;
    });
  }
  var ready = refresh();
  // Muat ulang berkala agar perubahan petugas lain dan isi sheet ikut terlihat.
  setInterval(function () { if (document.visibilityState === "visible") refresh().catch(function () {}); }, 60000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") refresh().catch(function () {}); });

  function docRef(path) {
    var parts = path.split("/"), col = parts[0], id = parts[1];
    if (col === "config") return {
      id: id,
      onSnapshot: function (next) { (st.confL[id] = st.confL[id] || []).push(next); next(snapDoc(id, st.conf[id])); return function () {}; },
      set: function (v) { return run("saveConfig", id, v).then(applyConfig); }
    };
    return {
      id: id,
      set: function (body) {
        return run("saveTL", id, body).then(function (r) {
          var cur = st.recs.get(id) || {}, merged = Object.assign({}, cur, body, { updatedAt: r.updatedAt, updatedBy: r.updatedBy });
          st.recs.set(id, merged); emit();
        });
      },
      update: function (part) { return this.set(Object.assign({}, st.recs.get(id) || {}, part)); },
      delete: function () { return Promise.reject({ code: "not_allowed", message: "Hapus baris SPPT langsung di sheet register." }); }
    };
  }
  var db = {
    doc: docRef,
    collection: function (name) {
      return {
        doc: function (id) { return docRef(name + "/" + id); },
        onSnapshot: function (next, error) { var l = { next: next, error: error }; st.listeners.add(l); if (st.loaded) emit(); return function () { st.listeners.delete(l); }; }
      };
    }
  };
  var user = {
    id: function () { return Promise.resolve(st.me && st.me.email); },
    can: function (c) { return Promise.resolve(c === "data.write" ? !!(st.me && st.me.canWrite) : null); },
    canEdit: function () { return Promise.resolve(st.peran === "admin"); },
    isOwner: function () { return Promise.resolve(st.peran === "admin"); },
    profiles: function (ids) { var o = {}; ids.forEach(function (i) { o[i] = { id: i, name: String(i || "").split("@")[0] }; }); return Promise.resolve(o); }
  };
  var downloads = {
    save: function (req) {
      var blob = new Blob([req.data], { type: "text/csv;charset=utf-8" }), a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = req.filename; a.target = "_blank"; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      return Promise.resolve({ status: "saved" });
    }
  };
  window.SAPA = { state: st, refresh: refresh };
  window.claude = {
    use: function (name) {
      return ready.then(function () { return name === "db" ? db : name === "user" ? user : name === "downloads" ? downloads : null; },
        function (e) { var n = document.getElementById("connNotice"); if (n) { n.hidden = false; n.textContent = "Data tidak bisa dimuat: " + e.message; } return null; });
    }
  };
})();
</script>
